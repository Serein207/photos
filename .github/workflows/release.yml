name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-opencv-librsvg-onnxruntime
          restore-keys: brew-${{ runner.os }}-

      - name: Install dependencies
        run: brew install opencv librsvg onnxruntime

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Build icon
        run: bash scripts/build-icon.sh

      - name: Cache CMake build (macOS)
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-macos-${{ hashFiles('CMakeLists.txt', 'src/**') }}
          restore-keys: cmake-macos-

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        run: |
          $QT_ROOT_DIR/bin/macdeployqt build/photos.app -qmldir=. -dmg
          mv build/photos.dmg photos-${{ github.ref_name }}-macos.dmg

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: photos-${{ github.ref_name }}-macos.dmg

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Cache OpenCV
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: C:\tools\opencv
          key: opencv-win-4.9.0

      - name: Install OpenCV
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: choco install opencv --version=4.9.0 -y

      - name: Set OpenCV_DIR
        run: echo "OpenCV_DIR=C:\tools\opencv\build\x64\vc16\lib" >> $env:GITHUB_ENV

      - name: Cache Inkscape
        id: cache-inkscape
        uses: actions/cache@v4
        with:
          path: C:\Program Files\Inkscape
          key: inkscape-win-1.4

      - name: Install Inkscape
        if: steps.cache-inkscape.outputs.cache-hit != 'true'
        run: choco install inkscape -y

      - name: Build icon (PNG sizes + .ico)
        shell: pwsh
        run: |
          $inkscape = Get-Command inkscape -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $inkscape) {
            $inkscape = Get-ChildItem "C:\Program Files\Inkscape" -Recurse -Filter inkscape.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $inkscape) { Write-Error "Inkscape not found"; exit 1 }

          $root = (Get-Location).Path
          $svg  = "$root\assets\AppIcon.svg"
          New-Item -ItemType Directory -Force -Path "$root\assets\AppIcon.iconset" | Out-Null

          foreach ($size in @(16, 32, 48, 64, 128, 256)) {
            $out = "$root\assets\AppIcon.iconset\icon_$size.png"
            & $inkscape -w $size -h $size $svg -o $out --export-overwrite 2>&1 | Out-Null
            if (-not (Test-Path $out)) { Write-Error "Failed: $out"; exit 1 }
          }
          magick "$root\assets\AppIcon.iconset\icon_16.png" `
                 "$root\assets\AppIcon.iconset\icon_32.png" `
                 "$root\assets\AppIcon.iconset\icon_48.png" `
                 "$root\assets\AppIcon.iconset\icon_256.png" `
                 "$root\assets\AppIcon.ico"

      - name: Cache ONNXRuntime
        id: cache-onnx
        uses: actions/cache@v4
        with:
          path: onnxruntime
          key: onnxruntime-win-x64-1.20.1

      - name: Install ONNXRuntime
        if: steps.cache-onnx.outputs.cache-hit != 'true'
        run: |
          $ver = "1.20.1"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$ver/onnxruntime-win-x64-$ver.zip"
          Invoke-WebRequest $url -OutFile onnxruntime.zip
          Expand-Archive onnxruntime.zip -DestinationPath onnxruntime
          echo "ONNXRUNTIME_ROOT=$pwd\onnxruntime\onnxruntime-win-x64-$ver" >> $env:GITHUB_ENV

      - name: Set ONNXRUNTIME_ROOT
        run: |
          $ver = "1.20.1"
          echo "ONNXRUNTIME_ROOT=$pwd\onnxruntime\onnxruntime-win-x64-$ver" >> $env:GITHUB_ENV

      - name: Cache CMake build (Windows)
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-windows-${{ hashFiles('CMakeLists.txt', 'src/**') }}
          restore-keys: cmake-windows-

      - name: Configure
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=OFF `
            -DOpenCV_DIR="$env:OpenCV_DIR" `
            -DONNXRUNTIME_INCLUDE_DIRS="$env:ONNXRUNTIME_ROOT\include" `
            -DONNXRUNTIME_LIBS="$env:ONNXRUNTIME_ROOT\lib\onnxruntime.lib"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        run: |
          mkdir staging
          copy build\Release\photos.exe staging\
          # windeployqt handles Qt DLLs + QML plugins
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --qmldir . --release staging\photos.exe
          # OpenCV and ONNXRuntime DLLs are copied by CMake post-build into build\Release\
          copy "build\Release\opencv_world*.dll" staging\ 2>$null
          copy "build\Release\onnxruntime*.dll" staging\ 2>$null
          Compress-Archive -Path staging\* -DestinationPath photos-${{ github.ref_name }}-windows.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: photos-${{ github.ref_name }}-windows.zip
